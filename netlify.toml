[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Vite fingerprints generated files in this dedicated directory, so they can be cached forever.
# Public wedding images remain outside /assets/vite and do not receive this immutable policy.
[[headers]]
  for = "/assets/vite/*"

  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML must revalidate so a new deployment is visible without a stale shell.
[[headers]]
  for = "/"

  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/index.html"

  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
