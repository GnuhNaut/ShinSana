    <script>
      (() => {
        const supportsRestoration = 'scrollRestoration' in history;
        const initialHash = location.hash;
        if (initialHash) history.replaceState(history.state, '', `${location.pathname}${location.search}`);
        window.__invitationEntryScroll = {
          originalScrollRestoration: supportsRestoration ? history.scrollRestoration : undefined,
          initialHash,
          pending: true,
        };
        if (supportsRestoration) history.scrollRestoration = 'manual';
        scrollTo(0, 0);
      })();
    </script>
